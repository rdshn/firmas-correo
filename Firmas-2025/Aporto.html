<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    
<!-- =======================================
   Wilmer Reyes
   =========================================== -->
  <table cellpadding="0" cellspacing="0"
    style="width: 780px; font-family: Arial, sans-serif; border-bottom: 10px solid #6FC7DA;">
    <tr>
      <!-- Logo -->
      <td style="padding: 10px; width: 160px;">
        <img src="https://rds.org.hn/firma/aporto.svg" alt="RDSHN" style="height: 80px;">
      </td>

      <!-- Datos -->
      <td style="padding: 10px; vertical-align: top; color: #2D306A;  vertical-align: middle;">
        <div style="font-weight: bold; font-size: 20px;">
          Wilmer Reyes
          <span style="color: #6FC7DA; font-size: 12px;font-weight:200;">(He/Him/His/El)</span>
        </div>
        <div style="margin-top: 4px;color: #2D306A;font-size: 15px;">Lider de Movilización de Recursos e Iniciativas Estrátegicas <br>Director Ejecutivo</div>
      </td>

      <!-- QR -->
      <td style="padding: 10px 15px 0px 0px; width: 120px;" align="left">
        <img src="https://rds.org.hn/firma/qr/wilmer-aporto.png" alt="QR Code"
          style="height: 100px;border:8px solid rgb(255, 255, 255);margin-bottom: -35px; border-radius: 10px;margin-right: 40px;">
      </td>
    </tr>

    <tr bgcolor="#2D306A" style="background-color: #2D306A;">
      <td colspan="3" style="padding: 15px; font-size: 13px; color: #ffffff;">
        <table cellpadding="0" cellspacing="0" border="0" style="width:550px; background-color: #2D306A;"
          bgcolor="#2D306A">
          <tr>
            <!-- Teléfono -->
            <td valign="middle"
              style="vertical-align: middle; color: #ffffff; font-family: Arial, sans-serif; font-size: 13px;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="vertical-align: middle; padding-right: 5px;">
                    <img src="https://rds.org.hn/firma/cel.svg" alt="Teléfono" style="height: 20px; display: block;">
                  </td>
                  <td style="vertical-align: middle;">
                   +504 2235-4141 | 9992-1960
                  </td>
                </tr>
              </table>
            </td>

            <!-- Correo -->
            <td valign="middle"
              style="vertical-align: middle; color: #ffffff; font-family: Arial, sans-serif; font-size: 13px;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="vertical-align: middle; padding-right: 5px;">
                    <img src="https://rds.org.hn/firma/email.svg" alt="Correo" style="height: 20px; display: block;">
                  </td>
                  <td style="vertical-align: middle;">
                   wilmer@rds.org.hn
                  </td>
                </tr>
              </table>
            </td>

            <!-- Ubicación -->
            <td valign="middle" align="center"
              style="vertical-align: middle; color: #ffffff; font-family: Arial, sans-serif; font-size: 13px;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="vertical-align: middle; padding-right: 5px;">
                    <img src="https://rds.org.hn/firma/map.svg" alt="Ubicación" style="height: 20px; display: block;">
                  </td>
                  <td style="vertical-align: middle;">
                    Tegucigalpa, Honduras.
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

  </body>

</html>
